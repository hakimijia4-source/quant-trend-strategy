[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trend-strategy"
version = "0.1.0"
description = "Point-in-time single-stock trend research with compliant market data and a falsifiable cognition layer."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
]
parquet = [
  "pyarrow>=15",
]
dev = [
  "pytest>=8",
]

[project.scripts]
quant-trend = "quant_trend.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
